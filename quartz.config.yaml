# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Prepper
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  # Prepper: no analytics. The site is a personal library; nothing phones home.
  analytics: null
  locale: en-US
  baseUrl: localhost:8080
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      # Prepper: 500 is requested alongside Quartz's own 400 and 700 because it is the
      # weight Material's `title-*` and `label-*` roles are set at, and `prepper/tokens`
      # maps both Material reference typefaces onto this family. Without it, every role in
      # the scale that asks for 500 falls back to 400 -- the topic tree's own names among
      # them -- and the chrome loses a step of hierarchy silently.
      header:
        name: Schibsted Grotesk
        weights: [400, 500, 700]
      # Prepper: a serif, because a Lesson should read like a document rather than like
      # documentation. `prepper/reading` restates this family at the head of a
      # generic-serif stack -- Quartz's own fallback for `--bodyFont` is hard-coded sans,
      # so a page whose webfont has not arrived would set its prose in sans -- and the two
      # names have to be changed together.
      body: Source Serif 4
      code: IBM Plex Mono
    # Prepper: **inert**. Colour lives in `./prepper/tokens`, derived from one seed
    # (`#284b63`) through Material 3's own role set, and Quartz's nine names below are
    # redefined as aliases onto those roles on every page -- see
    # `docs/adr/0003-material-3-as-the-chromes-token-vocabulary.md`. Nothing the reader sees
    # takes its colour from this block. Two files claiming to set the same colour, with one
    # silently losing, is worse than one file that says where colour lives; pasting hexes
    # back in here is undoing that decision, not fixing it.
    #
    # One loose end, named rather than papered over: Quartz also derives `--accent-h/-s/-l`
    # from `secondary` below and emits them on every page. No stylesheet in the build reads
    # them today, so they render nothing -- but they now disagree with the aliased
    # `--secondary`, and an upstream merge that starts consuming them would paint from here.
    #
    # The values are kept, and kept legible, for one reason: `@quartz-community/og-image`
    # reads them directly to render a social card with satori, which needs a real colour and
    # cannot resolve a custom property. That renderer is a build artifact outside Quartz's
    # layout, in the same category as `prepper/report` -- component CSS cannot reach either,
    # so both hold a copy of a palette they no longer control.
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  # Prepper: off. A note carries no date -- the spec settled that the ULID encodes
  # creation and nothing reads it -- so this plugin has no frontmatter to read and
  # falls back to `new Date()`, stamping every page with the build clock. That would
  # make the build a function of more than `content/`, which is exactly what seam 1
  # rests on it not being.
  - source: "@quartz-community/created-modified-date"
    enabled: false
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  # Prepper: ours. Order 25 is the free slot between syntax highlighting (20) and
  # obsidian-flavoured-markdown (30), and the downstream half is the load-bearing one: a
  # quiz fence's body is re-parsed into the tree here, and OFM at 30 is what turns the
  # wikilinks inside it into anchors that `crawl-links` (60) then records as edges. Run it
  # after 30 and a link written in a quiz explanation would stay text. See
  # `prepper/quiz/index.ts`.
  - source: "./prepper/quiz"
    enabled: true
    order: 25
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  # Prepper: ours. Order 35 is the free slot after obsidian-flavoured-markdown (30) and
  # before github-flavoured-markdown (40). Downstream of 30 on purpose: OFM rewrites
  # Obsidian's syntax while the body is still a flat run of blocks, and folding it into
  # sections first would hand that transform a shape it has no reason to expect. Upstream of
  # 60 on purpose too: the `source` chips this injects are ordinary links, and `crawl-links`
  # is what marks them external. See `prepper/problems/index.ts`.
  - source: "./prepper/problems"
    enabled: true
    order: 35
  # Prepper: ours. Order 36 is the free slot straight after `./prepper/problems` (35), and
  # after is the only place it can go: a Problem has already been folded on its named H2s and
  # had two of them sealed by then, and this transform leaves that note type alone rather than
  # putting a fold round a seal. Everything else is folded on every heading it was written
  # with, nested, and **ships closed** -- the same `<details>` the seal is, for the same reason
  # it is markup rather than a script. See `prepper/folding/index.ts`.
  - source: "./prepper/folding"
    enabled: true
    order: 36
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  # Prepper: ours. Order 65 puts it straight after `crawl-links` (60), which is what
  # resolves a wikilink and records the outgoing edge -- so this reads a resolution that
  # has already happened rather than making it a second time, and an unwritten link is
  # already a link-graph node by the time it is marked unclickable.
  - source: "./prepper/links"
    enabled: true
    order: 65
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  # Prepper: ours, and deliberately carrying **no `order`**. It has to run after
  # `description` (70), because its whole job is to overwrite the `file.data.text` that
  # plugin sets -- and that requirement is stated as arithmetic on `description`'s own
  # declared order rather than as the number 71 typed here. Quartz reads `defaultOrder` off
  # a plugin's manifest whenever an entry omits one, so leaving `order:` out is what lets
  # the expression win. Write `order: 71` here and it silently outranks the expression, and
  # the day upstream moves `description` the index quietly keeps every quiz answer this
  # plugin exists to strip. See `prepper/search-index/index.ts`.
  - source: "./prepper/search-index"
    enabled: true
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  # Prepper: off. This is a *filter*: `shouldPublish` drops a `draft: true` note from
  # `content[]` before any emitter sees it, and validation is an emitter over the whole
  # corpus. Leaving it on would make `draft: true` soften every rule -- a half-written
  # note with no `id` would validate clean by being invisible -- and the spec is explicit
  # that publication and validity are separate concerns.
  #
  # The consequence, stated plainly: a `draft: true` note now gets a page like any other.
  # `draft` marks intent and keeps a note's body links out of the Vault report's authoring
  # queue; it does not hide the note. Hiding one, if that is ever wanted, is a rendering
  # decision -- unlisted, which leaves the note in the corpus the rules see -- and it
  # belongs to the reading-surface work, never to a filter.
  - source: "@quartz-community/remove-draft"
    enabled: false
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      # Prepper: no feed and no sitemap. There is nothing to subscribe to -- this is one
      # dev's library, not a blog -- and both stamp the build clock into their output,
      # which is the last thing making the build a function of more than `content/`.
      enableSiteMap: false
      enableRSS: false
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  # Prepper: off. `./prepper/search-index` copies `topic` into `tags` so that search has
  # the field it reads, and that is the only thing the derived field is for. Left on, this
  # would generate `/tags/big-o` listing every note with that topic -- a second index page,
  # at a second URL, that nothing links to, competing with the Term page that is already
  # the canonical topic index. "We have tags now" is not an invitation.
  - source: "@quartz-community/tag-page"
    enabled: false
  # Prepper: off, replaced by `./prepper/topics` below. The explorer is a *directory*
  # tree, and the question the sidebar has to answer -- what shall I study today -- is one
  # the dev asks in topics. `lessons/` and `terms/` are where the build reads a note's type
  # from; they are not a subject, and a reader navigating them is navigating our filing
  # system rather than their own.
  - source: "@quartz-community/explorer"
    enabled: false
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  # Prepper: ours, and the one place the vendoring line is crossed. Quartz's search is
  # adopted whole in mechanism -- the same build-time `contentIndex.json`, the same three
  # Flexsearch indexes, the same preview pane -- but a result has to carry a type chip and
  # a `problems/` result has to carry no excerpt, and both of those are edits to the client
  # script `@quartz-community/search` ships, which has no option for either. So that
  # package is dropped and its two built assets are vendored under `prepper/search/vendor/`,
  # pinned by version and by the sha256 of the pristine originals. Core Quartz stays a
  # remote and is not patched. See `prepper/search/README.md`.
  - source: "./prepper/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  # Prepper: off, replaced by `./prepper/edges` below. Upstream's panel lists every note
  # that links here, whatever field the link sat in, and labels each by `title` -- which is
  # right for a garden and wrong here. Prepper types an edge by the field it was written
  # in, and a typed edge renders in context, where the reader is already looking. A panel
  # that repeated them would be a second, worse copy of what the page already shows.
  - source: "@quartz-community/backlinks"
    enabled: false
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  # Prepper: off. A breadcrumb states a path through a hierarchy, and there is none: a
  # note's place is its topics, which it has several of and which `prepper/reading` renders
  # as chips under the title. The directory a note sits in is the build's filing system,
  # not a route the reader took. The same reasoning keeps next/previous, a progress bar and
  # a review-queue badge off the page: there is no reading order to imply and no per-user
  # state to display. Upstream ships no component for any of those three, so this entry is
  # the only one there is to turn off.
  - source: "@quartz-community/breadcrumbs"
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links: {}
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      # Prepper: `tags` is deliberately absent. The build owns that field --
      # `./prepper/search-index` copies `topic` into it -- and it exists to feed search and
      # nothing else. Rendered here it would be a second topic display competing with the
      # chips `prepper/reading` puts under the title, linking to `/tags/` pages that
      # `tag-page` above deliberately does not generate.
      includedProperties:
        - description
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  # Prepper: ours, four times over. Quartz places one component per plugin entry, from that
  # entry's own `layout:` block, so a component that renders in three positions is listed
  # once per position and told which slice of the link graph it is by `options.section`.
  # See `prepper/edges/index.ts`.
  #
  # Each entry uses the object source form to take its own `name`. That is not decoration:
  # `name` is the key Quartz installs and looks a plugin up by, and four entries sharing one
  # would install as one, which upstream's installer then reports as three plugins missing
  # and exits on.
  #
  # Priorities put "Read first" below the title and the meta line (10, 20) and above the
  # note, and the two afterBody rails in reading order: what this note practises, then what
  # it unlocks.
  - source:
      repo: "./prepper/edges"
      name: edges-read-first
    enabled: true
    options:
      section: read-first
    layout:
      position: beforeBody
      priority: 25
  - source:
      repo: "./prepper/edges"
      name: edges-practices
    enabled: true
    options:
      section: practices
    layout:
      position: afterBody
      priority: 10
  - source:
      repo: "./prepper/edges"
      name: edges-unlocks
    enabled: true
    options:
      section: unlocks
    layout:
      position: afterBody
      priority: 20
  - source:
      repo: "./prepper/edges"
      name: edges-backlinks
    enabled: true
    options:
      section: backlinks
    layout:
      position: right
      priority: 50
  # Prepper: ours, twice over. The generated topic index -- `topic` inverted on the Term
  # note -- has two placements, so the plugin is listed once per placement and told which
  # view it is by `options.view`. Same arrangement as `./prepper/edges` above, and the same
  # reason each entry takes its own `name`: `name` is the key Quartz installs and looks a
  # plugin up by, and two entries sharing one would install as one.
  #
  # The sidebar takes the explorer's old position, which is what it replaces. The Term
  # page's index sits at the top of `afterBody`, which puts it below the note's own body --
  # so a Term with no Lessons reads as an area overview followed by its index, and the
  # typed-edge rails follow both.
  - source:
      repo: "./prepper/topics"
      name: topics-sidebar
    enabled: true
    options:
      view: sidebar
    layout:
      position: left
      priority: 50
  - source:
      repo: "./prepper/topics"
      name: topics-term-index
    enabled: true
    options:
      view: term-index
    layout:
      position: afterBody
      priority: 5
  # Prepper: ours. The control that collapses the left rail to a gutter, and the one
  # preference this app remembers.
  #
  # Priority 5 puts it above the page title (10), at the top of the rail. Two things about the
  # placement are load-bearing rather than cosmetic. It is a **direct child of the rail** -- no
  # `group:` -- because collapsing hides the rail's other children by selector and the control
  # has to survive that; a member of the `toolbar` group would go down with the group. And it
  # is in `left` rather than `beforeBody`, where a component with nothing much to render
  # usually goes, because `beforeBody` sits inside the `.popover-hint` that Quartz's search
  # preview clones -- which would splice a second copy of this button over the page.
  #
  # See `prepper/sidebar/index.ts` for why one key in `localStorage` is not a hole in "the app
  # records nothing".
  - source: "./prepper/sidebar"
    enabled: true
    layout:
      position: left
      priority: 5
  # Prepper: ours. The chrome's design tokens: Material 3's colour, elevation, typography
  # and shape roles, all derived from the seed `#284b63`, plus the aliases that resolve
  # Quartz's nine colour names onto them. No motion subsystem, deliberately -- nothing of
  # ours animates, and the one place it would tempt is where the architecture insists the
  # seal is markup.
  #
  # A component that renders nothing: Quartz collects `Component.css` from the configured
  # component list rather than from what a page rendered, so the tokens land on every
  # laid-out page including 404, and a `:root` block in a component stylesheet redefines
  # Quartz's own theme by identical selector on source order. The position below is
  # therefore arbitrary -- the component has to be in the layout for Quartz to instantiate
  # it, and it occupies an empty slot once it is. See `prepper/tokens/index.ts` and
  # `docs/adr/0003-material-3-as-the-chromes-token-vocabulary.md`.
  #
  # The reading surface is **not** a consumer, on the merits: Material has no measure, no
  # paragraph role above 16px, and no serif. See the ADR.
  - source: "./prepper/tokens"
    enabled: true
    layout:
      position: beforeBody
      priority: 1
  # Prepper: ours. The reading surface: the ~38rem measure the prose column holds at every
  # viewport width, the serif it is set in, the blockquote that carries an aside, and a
  # note's topics as chips under its title. Priority 12 puts the chips directly under the
  # article title (10) and above everything else `beforeBody` holds -- the properties view
  # (15), the meta line (20), the "Read first" rail (25) -- which is where a note's
  # subjects belong: read with the title, not with the rails.
  #
  # It is a component rather than an emitter because that is how a stylesheet reaches every
  # page: Quartz collects `Component.css` from the configured component list rather than
  # from what a page rendered, so the measure lands on a Term with no chips too. See
  # `prepper/reading/index.ts`.
  - source: "./prepper/reading"
    enabled: true
    layout:
      position: beforeBody
      priority: 12
  # Prepper: ours. The app's entry point: a generated `index.html` holding the same topic
  # index the sidebar renders. A **pageType** rather than an emitter, so the page comes out
  # through Quartz's own layout instead of through a copy of it -- and it yields to a
  # written `content/index.md` if one ever exists. See `prepper/home/index.ts`.
  - source: "./prepper/home"
    enabled: true
  # Prepper: ours. The link graph, computed once over the whole corpus and written to
  # `static/linkGraph.json` for the topic index (07) and the Vault report (14) to read.
  # It does not replace `contentIndex.json`, which stays exactly as Quartz emits it.
  #
  # The object source form here buys one thing, and it is not decoration. Quartz names a
  # plugin after its **source path's basename**, never after the `manifest.name` the module
  # exports -- so as `"./prepper/graph"` this emitter was the plugin named `graph`. An entry
  # with no `layout:` block is then looked up in the component registry by that name and by
  # its PascalCase form, and placed at whatever `defaultPosition` the thing that answers
  # declares; the registry is flat and global, and `@quartz-community/graph` registers its
  # panel under the unqualified key `Graph`. This emitter therefore adopted the community
  # graph panel and asked for it a second time, in the same right rail the entry below
  # already places it in -- silently, with the plugin named exactly once in this file.
  # `prepper/testing/layout.test.ts` is the tripwire for the next such collision.
  - source:
      repo: "./prepper/graph"
      name: prepper-graph
    enabled: true
  # Prepper: ours. The Workshop boundary, page half: `research`, `record` and `mission`
  # are withheld from the emitted site, so the reader never meets one. It is a *filter*,
  # which is the only mechanism that takes a note out of the corpus -- and which is why
  # it hands the notes it withheld to validation, an emitter that has to go on seeing
  # them. See `prepper/workshop/index.ts`; it is the same collision that keeps
  # `remove-draft` disabled above, resolved rather than traded off.
  - source: "./prepper/workshop"
    enabled: true
  # Prepper: ours. The whole-corpus emitter seam is where validation runs, so every
  # build -- `npm run build`, `npm run serve`, and the `npm run validate` CLI, which
  # invokes this same pipeline -- reports the same violations. It emits no files and
  # never throws: under `--serve` the dev server has to survive a broken vault.
  - source: "./prepper/validation"
    enabled: true
  # Prepper: ours. The build's other channel -- validation shouts, the report whispers, and
  # the two never share a line. A page at `/report` written by **every** build, published
  # unlisted rather than `--serve`-only, so the build has one mode rather than two that
  # diverge.
  #
  # An emitter, and that is load-bearing rather than incidental: an emitter runs after the
  # last transform, so nothing the report links to can become a graph edge. Generated as a
  # virtual `content/` file instead, it would link to every orphan it lists, each orphan
  # would gain an inbound link, and the hygiene section would erase itself on the second
  # build -- silently. See `prepper/report/render.ts`.
  - source: "./prepper/report"
    enabled: true
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
