# The curated company list the scanner scans. Committed config, not personal data
# (platform-architecture ticket 07). The scanner does NOT discover companies — this
# hand-authored list IS the target set. Filters are NOT here: they live on the
# Candidate Profile (Preferences), because the match signal is the candidate.
#
# Schema (ticket 04 / scanner/CONTEXT.md):
#   - slug:     stable lowercased id, never changes once a Company has Roles against it
#   - name:     display name
#   - careers:  one or more Sources, each { url, ats? }
#       ats hint ∈ greenhouse | lever | ashby | workday | html — the applicant-tracking
#       system the page is served by, which sizes the Anti-corruption layer. It is a
#       curation-time HINT: filled where reasonably known, left blank where unknown.
#   - tags:     optional free labels (used for notes/skew, not for filtering)
#   - notes:    optional prose
#
# The `url`s and `ats` hints below are best-known at curation time and are NOT verified.
# Ticket 08 (ATS-landscape research) confirms each URL, its ATS, and whether it is
# server- or JS-rendered — the empirical facts ticket 09's ACL design consumes.
